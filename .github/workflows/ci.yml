name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_DRIVER: pglite
      PGLITE_DATA_DIR: memory://
      LAKE_ROOT: .data/lake
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:pii
      - run: npm run db:migrate
      # Includes tests/qa/** (rule boundaries, adversarial uploads, state machine, ledger, security).
      - run: npm run test:coverage
      - run: npm run build
      # Architecture 13.5 A06: surfaced, non-blocking until the current dev-dependency advisories are resolved (see docs/qa/phase1-report.md).
      - run: npm audit --audit-level=high
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    # First wiring of the browser suite in CI; promote to blocking once it has run green on main.
    continue-on-error: true
    env:
      NODE_ENV: test
      DB_DRIVER: pglite
      PGLITE_DATA_DIR: .data/pglite
      LAKE_ROOT: .data/lake
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run build
      - name: Start server
        run: |
          nohup npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
      - run: npm run e2e:phase1
      - run: npm run e2e:qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-qa
          path: |
            docs/qa/e2e-qa-results.json
            docs/qa/axe-summary.json
            docs/screenshots/phase1/
            server.log
          if-no-files-found: ignore
